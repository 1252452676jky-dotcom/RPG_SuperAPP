<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Productivity Superapp</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body { font-family: 'Courier New', monospace; }
  .cal-cell { min-height: 84px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }
  .modal-bg { background: rgba(0,0,0,0.6); }
  .drag-handle { cursor: grab; }
  .dragging { opacity: 0.4; }
  .drag-over-top { border-top: 3px solid #818cf8 !important; }
  .drag-over-bottom { border-bottom: 3px solid #818cf8 !important; }
  .ss-wrap { border: 1px solid #334155; border-radius: 4px; overflow: auto; resize: vertical; background: #1e293b; max-height: 220px; }
  .ss-row { display: flex; align-items: stretch; border-bottom: 1px solid #334155; }
  .ss-row:last-child { border-bottom: none; }
  .ss-num { width: 34px; min-width: 34px; text-align: center; color: #64748b; font-size: 11px; display: flex; align-items: center; justify-content: center; background: #0f172a; border-right: 1px solid #334155; user-select: none; }
  .ss-cell { flex: 1; background: transparent; color: #e2e8f0; border: none; outline: none; padding: 3px 8px; font-family: 'Courier New', monospace; font-size: 13px; min-width: 0; }
  .ss-cell:focus { background: #334155; }

  /* ---- Toasts ---- */
  #toastWrap { position: fixed; bottom: 18px; right: 18px; z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 8px; background: #064e3b; border: 1px solid #10b981; color: #ecfdf5;
           padding: 8px 14px; border-radius: 6px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.45);
           opacity: 0; transform: translateY(10px); transition: opacity .18s ease, transform .18s ease; max-width: 340px; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: #7f1d1d; border-color: #ef4444; color: #fef2f2; }
  .toast.info { background: #1e3a8a; border-color: #6366f1; color: #eef2ff; }
  .prio-sel { border: none; outline: none; appearance: none; -webkit-appearance: none; text-align: center; cursor: pointer; }
  body { overflow-x: hidden; }
  .prio-sel { max-width: 92px; }
  @media (max-width: 640px) {
    .cal-cell { min-height: 56px; }
    #toastWrap { left: 12px; right: 12px; bottom: 12px; align-items: stretch; }
    .toast { max-width: none; }
  }

</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24">

<header class="sticky top-0 z-40 bg-slate-800 border-b-4 border-indigo-600 px-4 py-2 flex items-center justify-between flex-wrap gap-2">
  <h1 class="text-lg font-bold text-indigo-300"><i class="fa-solid fa-dragon"></i> RPG Superapp</h1>
  <div class="flex items-center gap-3">
    <span class="text-amber-300 text-sm font-bold" title="Gems"><i class="fa-solid fa-gem"></i> <span id="gemDisplay">0</span></span>
    <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded text-sm"><i class="fa-solid fa-download"></i> Export JSON</button>
    <label class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-sm cursor-pointer"><i class="fa-solid fa-upload"></i> Import JSON
      <input type="file" accept=".json" class="hidden" onchange="importData(event)">
    </label>
  </div>
</header>

<nav id="mainNav" class="flex flex-wrap gap-1 px-3 py-2 bg-slate-800/60"></nav>
<main id="content" class="p-4 max-w-6xl mx-auto"></main>

<div id="toastWrap"></div>

<div id="modal" class="hidden fixed inset-0 z-50 modal-bg flex items-center justify-center p-4"
     onmousedown="modalDown(event)" onmouseup="modalUp(event)">
  <div class="bg-slate-800 border-2 border-indigo-500 rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto p-5" id="modalInner"></div>
</div>

<script>
/* ===== SMALL UTILS (defined early: used by migrate/load) ===== */
const uid = () => Math.random().toString(36).slice(2, 10);
function fmtDate(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
const todayStr = () => fmtDate(new Date());
function parseDate(ds) { const [y,m,d] = String(ds).split('-').map(Number); return new Date(y, (m||1)-1, d||1); }
function daysUntil(ds) { if (!ds) return 0; return Math.round((parseDate(ds) - parseDate(todayStr())) / 86400000); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g,'&quot;'); }

/* ===== TOASTS (auto-fading notifications) ===== */
function toast(msg, type) {
  const wrap = document.getElementById('toastWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : type === 'info' ? ' info' : '');
  const icon = type === 'err' ? 'triangle-exclamation' : type === 'info' ? 'circle-info' : 'circle-check';
  el.innerHTML = `<i class="fa-solid fa-${icon}"></i><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 260); }, 2400);
}

/* ===== STATE ===== */
const LS_KEY = 'rpg_superapp_state_v1';

const defaultState = () => ({
  activeTab: 'party',
  categories: [],
  checklists: [],
  party: [],
  quests: [],
  trainings: [],
  shop: [],
  gems: 0,
  settings: { questTarget: 'even', trainingTarget: 'even' }
});

/* Migrate old backups: habits -> trainings, habitTarget -> trainingTarget, quest priority/recurrence defaults */
function migrate(data) {
  if (!data) return data;
  if (data.habits && !data.trainings) { data.trainings = data.habits; delete data.habits; }
  if (data.settings && data.settings.habitTarget && !data.settings.trainingTarget) {
    data.settings.trainingTarget = data.settings.habitTarget;
    delete data.settings.habitTarget;
  }
  if (Array.isArray(data.quests)) {
    data.quests.forEach(q => {
      if (q.priority === undefined || q.priority === null) q.priority = 2;
      q.priority = Math.min(4, Math.max(1, parseInt(q.priority) || 2));
      if (q.kind === 'recurring') {
        q.intervalCount = Math.max(1, parseInt(q.intervalCount) || 1);
        q.intervalUnit = q.intervalUnit || 'months';
        q.nextDate = q.nextDate || q.dueDate || todayStr();
        q.anchor = q.anchor || 'completion';
        q.history = Array.isArray(q.history) ? q.history : [];
      }
    });
  }
  return data;
}

let appState = load();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return Object.assign(defaultState(), migrate(JSON.parse(raw)));
  } catch(e) { console.warn('load failed', e); }
  return defaultState();
}
function save() {
  localStorage.setItem(LS_KEY, JSON.stringify(appState));
  const g = document.getElementById('gemDisplay');
  if (g) g.textContent = appState.gems || 0;
}

/* ===== XP / GEMS / LEVELING ===== */
function xpForLevel(level) { return Math.round(100 * Math.pow(level, 1.5)); }
function grantXP(amount, target) {
  if (!amount) return;
  if (target === 'even' || !target) {
    const recipients = appState.party;
    if (recipients.length === 0) return;
    const share = Math.floor(amount / recipients.length);
    recipients.forEach(m => addXpToMember(m, share));
  } else {
    const m = appState.party.find(p => p.id === target);
    if (m) addXpToMember(m, amount);
  }
}
function addXpToMember(m, amount) {
  m.xp += amount;
  while (m.xp >= xpForLevel(m.level)) { m.xp -= xpForLevel(m.level); m.level++; }
}
function grantGems(amount) { if (!amount) return; appState.gems = (appState.gems || 0) + amount; }
/* ===== DEFAULT REWARDS BY CATEGORY ===== */
const QUEST_DEFAULT_REWARD = {
  side:      { xp: 50,  gems: 50  },
  recurring: { xp: 100, gems: 100 },
  main:      { xp: 500, gems: 500 }
};
function defaultReward(kind) {
  return QUEST_DEFAULT_REWARD[kind] || QUEST_DEFAULT_REWARD.side;
}
let nqXpTouched = false, nqGemsTouched = false;
function syncQuestRewardDefaults() {
  const kindEl = document.getElementById('nqKind');
  if (!kindEl) return;
  const r = defaultReward(kindEl.value);
  const xpEl = document.getElementById('nqXp'), gemEl = document.getElementById('nqGems');
  if (xpEl)  { if (!nqXpTouched)   xpEl.value  = r.xp;   xpEl.placeholder  = r.xp; }
  if (gemEl) { if (!nqGemsTouched) gemEl.value = r.gems; gemEl.placeholder = r.gems; }
}

/* ===== PRIORITY ===== */
const PRIORITY_LEVELS = [
  { v: 4, label: 'Urgent', cls: 'bg-rose-600 text-white' },
  { v: 3, label: 'High',   cls: 'bg-orange-600 text-white' },
  { v: 2, label: 'Medium', cls: 'bg-sky-700 text-white' },
  { v: 1, label: 'Low',    cls: 'bg-slate-600 text-slate-200' }
];
function priorityInfo(p) {
  const v = Math.min(4, Math.max(1, parseInt(p) || 2));
  return PRIORITY_LEVELS.find(x => x.v === v);
}
function sortByPriority(list) {
  return list.slice().sort((a, b) => (parseInt(b.priority) || 2) - (parseInt(a.priority) || 2));
}
function priorityOptions(val) {
  const v = Math.min(4, Math.max(1, parseInt(val) || 2));
  return PRIORITY_LEVELS.map(p => `<option value="${p.v}" ${p.v === v ? 'selected' : ''}>${p.label}</option>`).join('');
}
function prioritySelectInline(q) {
  const pi = priorityInfo(q.priority);
  return `<select onchange="setQuestPriority('${q.id}', this.value)" title="Priority"
    class="prio-sel text-[11px] font-bold rounded px-1.5 py-1 ${pi.cls}">
    ${PRIORITY_LEVELS.map(p => `<option class="bg-slate-700 text-white" value="${p.v}" ${p.v === pi.v ? 'selected' : ''}>${p.label}</option>`).join('')}
  </select>`;
}
function setQuestPriority(id, val) {
  const q = appState.quests.find(x => x.id === id);
  if (!q) return;
  q.priority = Math.min(4, Math.max(1, parseInt(val) || 2));
  save(); render();
  toast(`"${q.title}" priority: ${priorityInfo(q.priority).label}`);
}

/* ===== RECURRENCE MATH ===== */
const UNIT_LABEL = { weeks: 'week', months: 'month', years: 'year' };
function addInterval(dateStr, count, unit) {
  const dt = parseDate(dateStr);
  const n = Math.max(1, parseInt(count) || 1);
  if (unit === 'weeks') { dt.setDate(dt.getDate() + 7 * n); }
  else {
    const day = dt.getDate();
    dt.setDate(1);
    if (unit === 'years') dt.setFullYear(dt.getFullYear() + n);
    else dt.setMonth(dt.getMonth() + n);
    const lastDay = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
    dt.setDate(Math.min(day, lastDay));
  }
  return fmtDate(dt);
}
function intervalText(q) {
  const n = Math.max(1, parseInt(q.intervalCount) || 1);
  const u = UNIT_LABEL[q.intervalUnit] || 'month';
  return `every ${n} ${u}${n > 1 ? 's' : ''}`;
}
function dueText(ds) {
  const d = daysUntil(ds);
  if (d === 0) return 'today';
  if (d < 0) return `${-d} day${-d > 1 ? 's' : ''} overdue`;
  return `in ${d} day${d > 1 ? 's' : ''}`;
}
function dueClass(ds) {
  const d = daysUntil(ds);
  return d < 0 ? 'text-rose-400' : d <= 7 ? 'text-amber-300' : 'text-slate-400';
}

/* ===== TABS ===== */
const fixedTabs = [
  { id: 'party', label: 'Party', icon: 'fa-users' },
  { id: 'quests', label: 'Quest Board', icon: 'fa-scroll' },
  { id: 'training', label: 'Training', icon: 'fa-dumbbell' },
  { id: 'shop', label: 'Shop', icon: 'fa-store' },
];
function renderNav() {
  const nav = document.getElementById('mainNav');
  nav.innerHTML = '';
  fixedTabs.forEach(t => nav.appendChild(tabBtn(t.id, `<i class="fa-solid ${t.icon}"></i> ${t.label}`)));
  appState.categories.forEach(c => {
    const wrap = document.createElement('span');
    wrap.className = 'inline-flex items-center rounded ' + (appState.activeTab === 'cat_' + c.id ? 'bg-indigo-600' : 'bg-slate-700');
    const tab = document.createElement('button');
    tab.className = 'px-3 py-1 text-sm ' + (appState.activeTab === 'cat_' + c.id ? 'text-white' : 'hover:bg-slate-600 rounded');
    tab.innerHTML = `<i class="fa-solid fa-dice"></i> ${escapeHtml(c.name)}`;
    tab.onclick = () => { appState.activeTab = 'cat_' + c.id; save(); render(); };
    const pen = document.createElement('button');
    pen.className = 'px-2 py-1 text-xs text-slate-300 hover:text-white';
    pen.title = 'Rename category';
    pen.innerHTML = '<i class="fa-solid fa-pen"></i>';
    pen.onclick = (e) => { e.stopPropagation(); const n = prompt('Rename category:', c.name); if (n !== null) renameCategory(c.id, n); };
    wrap.appendChild(tab); wrap.appendChild(pen); nav.appendChild(wrap);
  });
  appState.checklists.forEach(cl => {
    const wrap = document.createElement('span');
    wrap.className = 'inline-flex items-center rounded ' + (appState.activeTab === 'chk_' + cl.id ? 'bg-emerald-600' : 'bg-slate-700');
    const tab = document.createElement('button');
    tab.className = 'px-3 py-1 text-sm ' + (appState.activeTab === 'chk_' + cl.id ? 'text-white' : 'hover:bg-slate-600 rounded');
    tab.innerHTML = `<i class="fa-solid fa-list-check"></i> ${escapeHtml(cl.name)}`;
    tab.onclick = () => { appState.activeTab = 'chk_' + cl.id; save(); render(); };
    const pen = document.createElement('button');
    pen.className = 'px-2 py-1 text-xs text-slate-300 hover:text-white';
    pen.title = 'Rename checklist';
    pen.innerHTML = '<i class="fa-solid fa-pen"></i>';
    pen.onclick = (e) => { e.stopPropagation(); const n = prompt('Rename checklist:', cl.name); if (n !== null) renameChecklist(cl.id, n); };
    wrap.appendChild(tab); wrap.appendChild(pen); nav.appendChild(wrap);
  });
  const add = document.createElement('button');
  add.className = 'px-3 py-1 rounded text-sm bg-slate-700 hover:bg-slate-600 border border-dashed border-slate-500';
  add.innerHTML = '<i class="fa-solid fa-plus"></i> Add';
  add.onclick = openAddTabMenu;
  nav.appendChild(add);
}
function tabBtn(id, html) {
  const b = document.createElement('button');
  const active = appState.activeTab === id;
  b.className = 'px-3 py-1 rounded text-sm ' + (active ? 'bg-indigo-600 text-white' : 'bg-slate-700 hover:bg-slate-600');
  b.innerHTML = html;
  b.onclick = () => { appState.activeTab = id; save(); render(); };
  return b;
}

/* ===== RENDER ROUTER ===== */
function render() {
  renderNav();
  const c = document.getElementById('content');
  const t = appState.activeTab;
  if (t === 'party') c.innerHTML = viewParty();
  else if (t === 'quests') {
    c.innerHTML = viewQuests(); mountCalendar('quests');
    enableDrag('mainQuestList', appState.quests, questDropPriority);
    enableDrag('sideQuestList', appState.quests, questDropPriority);
  }
  else if (t === 'training') { c.innerHTML = viewTraining(); mountCalendar('training'); enableDrag('trainingList', appState.trainings); }
  else if (t === 'shop') c.innerHTML = viewShop();
  else if (t.startsWith('cat_')) { const cid = t.slice(4); c.innerHTML = viewCategory(cid); enableCategoryDrag(cid); }
  else if (t.startsWith('chk_')) { const clid = t.slice(4); c.innerHTML = viewChecklist(clid); const cl = findChecklist(clid); enableDrag('chkList_' + clid, cl ? cl.items : []); }
  else c.innerHTML = '<p>Unknown tab</p>';
  save();
}

/* ===== DRAG & DROP ===== */
let dragSrcId = null;
function enableDrag(containerId, sourceArray, onDrop) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const rows = Array.from(container.querySelectorAll('[data-id]'));
  rows.forEach(row => {
    row.setAttribute('draggable', 'true');
    row.addEventListener('dragstart', e => { dragSrcId = row.getAttribute('data-id'); row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    row.addEventListener('dragend', () => { row.classList.remove('dragging'); rows.forEach(r => r.classList.remove('drag-over-top','drag-over-bottom')); });
    row.addEventListener('dragover', e => { e.preventDefault(); const rect = row.getBoundingClientRect(); const after = e.clientY > rect.top + rect.height / 2; row.classList.toggle('drag-over-bottom', after); row.classList.toggle('drag-over-top', !after); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over-top','drag-over-bottom'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      const targetId = row.getAttribute('data-id');
      const rect = row.getBoundingClientRect();
      const after = e.clientY > rect.top + rect.height / 2;
      if (typeof onDrop === 'function') onDrop(dragSrcId, targetId);
      reorderArray(sourceArray, dragSrcId, targetId, after);
      dragSrcId = null; save(); render();
    });
  });
}
/* Dropping a quest onto a quest of another priority adopts that priority. */
function questDropPriority(srcId, targetId) {
  if (!srcId || srcId === targetId) return;
  const s = appState.quests.find(q => q.id === srcId);
  const t = appState.quests.find(q => q.id === targetId);
  if (!s || !t) return;
  const sp = parseInt(s.priority) || 2, tp = parseInt(t.priority) || 2;
  if (sp !== tp) { s.priority = tp; toast(`"${s.title}" priority: ${priorityInfo(tp).label}`); }
}
function reorderArray(arr, srcId, targetId, after) {
  if (!srcId || srcId === targetId) return;
  const fromIdx = arr.findIndex(x => x.id === srcId);
  if (fromIdx === -1) return;
  const [moved] = arr.splice(fromIdx, 1);
  let toIdx = arr.findIndex(x => x.id === targetId);
  if (toIdx === -1) { arr.push(moved); return; }
  arr.splice(after ? toIdx + 1 : toIdx, 0, moved);
}

/* ===== PARTY ===== */
function viewParty() {
  let cards = appState.party.map(m => {
    const need = xpForLevel(m.level);
    const pct = Math.min(100, Math.round(m.xp / need * 100));
    return `<div class="bg-slate-800 rounded-lg p-3 border border-slate-600 hover:border-indigo-400 cursor-pointer" onclick="openMember('${m.id}')">
      <div class="flex items-center gap-3">
        ${m.img ? `<img src="${escapeAttr(m.img)}" class="w-14 h-14 object-cover rounded border border-slate-500">` : `<div class="w-14 h-14 rounded bg-slate-700 flex items-center justify-center text-2xl"><i class="fa-solid fa-user"></i></div>`}
        <div class="flex-1 min-w-0">
          <div class="font-bold truncate">${escapeHtml(m.name)}</div>
          <div class="text-xs text-slate-400">Lv ${m.level}</div>
          <div class="w-full bg-slate-700 rounded h-2 mt-1"><div class="bg-emerald-500 h-2 rounded" style="width:${pct}%"></div></div>
          <div class="text-[10px] text-slate-400 mt-0.5">${m.xp} / ${need} XP</div>
        </div>
      </div>
    </div>`;
  }).join('');
  if (!appState.party.length) cards = '<p class="text-slate-400 col-span-full">No party members yet. Add one below or from a generator result.</p>';
  return `
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-xl font-bold">Party</h2>
      <button onclick="addMemberManual()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1 rounded text-sm"><i class="fa-solid fa-plus"></i> Add Member</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${cards}</div>`;
}
function addMemberManual() {
  const name = prompt('Member name?');
  if (!name) return;
  appState.party.push({ id: uid(), name, level: 1, xp: 0, attributes: {}, img: '' });
  save(); render(); toast(`Party member "${name}" added`);
}
function openMember(id) {
  const m = appState.party.find(p => p.id === id);
  if (!m) return;
  const attrs = Object.entries(m.attributes || {}).map(([k,v]) =>
    `<div class="flex justify-between border-b border-slate-700 py-1"><span class="text-slate-400">${escapeHtml(k)}</span><span>${escapeHtml(String(v))}</span></div>`
  ).join('') || '<p class="text-slate-500 text-sm">No extra attributes.</p>';
  openModal(`
    <div class="flex items-start gap-4 mb-4">
      <div id="memberAvatar">
        ${m.img ? `<img src="${escapeAttr(m.img)}" class="w-24 h-24 object-cover rounded border border-slate-500">` : `<div class="w-24 h-24 rounded bg-slate-700 flex items-center justify-center text-3xl"><i class="fa-solid fa-user"></i></div>`}
      </div>
      <div class="flex-1">
        <h3 class="text-xl font-bold">${escapeHtml(m.name)}</h3>
        <p class="text-slate-400">Level ${m.level} — ${m.xp}/${xpForLevel(m.level)} XP</p>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4 text-sm">
      <div><label class="text-xs text-slate-400 block mb-1">Name</label>
        <input id="memberName" value="${escapeAttr(m.name)}" class="w-full bg-slate-700 rounded px-2 py-1"></div>
      <div><label class="text-xs text-slate-400 block mb-1">Level</label>
        <input id="memberLevel" type="number" min="1" value="${m.level}" class="w-full bg-slate-700 rounded px-2 py-1"></div>
    </div>
    <div class="mb-4">
      <label class="text-xs text-slate-400 block mb-1">Avatar Image URL</label>
      <input id="memberImg" value="${escapeAttr(m.img||'')}" placeholder="https://example.com/pic.png" class="w-full bg-slate-700 rounded px-2 py-1 text-sm">
    </div>
    <h4 class="font-bold text-indigo-300 mb-1">Attributes</h4>
    <div class="text-sm mb-4">${attrs}</div>
    <div class="flex gap-2 justify-end">
      <button onclick="deleteMember('${m.id}')" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm">Delete</button>
      <button onclick="saveMemberEdits('${m.id}')" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded text-sm">Save Changes</button>
      <button onclick="closeModal();render()" class="bg-slate-600 px-3 py-1 rounded text-sm">Close</button>
    </div>`);
}
function saveMemberEdits(id) {
  const m = appState.party.find(p => p.id === id);
  if (!m) return;

/* --- Recurring quest actions --- */
function nextOccurrence(q, fromDate) {
  const base = q.anchor === 'scheduled' ? (q.nextDate || fromDate) : fromDate;
  let next = addInterval(base, q.intervalCount, q.intervalUnit);
  let guard = 0;
  while (next <= fromDate && guard++ < 500) next = addInterval(next, q.intervalCount, q.intervalUnit);
  return next;
}
function completeRecurring(id, dateStr) {
  const q = appState.quests.find(x => x.id === id);
  if (!q || q.kind !== 'recurring') return;
  const doneOn = dateStr || todayStr();
  q.history = q.history || [];
  q.history.push(doneOn);
  grantXP(q.xp, q.target || appState.settings.questTarget);
  grantGems(q.gems);
  q.nextDate = nextOccurrence(q, doneOn);
  save(); render();
  toast(`"${q.title}" done — next due ${q.nextDate}${q.xp ? ` (+${q.xp} XP)` : ''}`);
}
function skipRecurring(id) {
  const q = appState.quests.find(x => x.id === id);
  if (!q || q.kind !== 'recurring') return;
  q.nextDate = nextOccurrence(q, q.nextDate);
  save(); render();
  toast(`"${q.title}" skipped — next due ${q.nextDate}`, 'info');
}

function saveQuestEdits(id) {
  const q = appState.quests.find(x => x.id === id);
  if (!q) return;
  const before = { title: q.title, note: q.note||'', xp: q.xp, gems: q.gems||0, priority: parseInt(q.priority)||2, kind: q.kind||'main', target: q.target, createdDate: q.createdDate, dueDate: q.dueDate||'' };
  q.title = document.getElementById('eqTitle').value.trim() || q.title;
  q.note = document.getElementById('eqNote').value.trim();
  q.xp = parseInt(document.getElementById('eqXp').value) || 0;
  q.gems = parseInt(document.getElementById('eqGems').value) || 0;
  q.priority = Math.min(4, Math.max(1, parseInt(document.getElementById('eqPriority').value) || 2));
  q.target = document.getElementById('eqTarget').value;
  q.createdDate = document.getElementById('eqCreated').value || q.createdDate;
  q.dueDate = document.getElementById('eqDue').value;
  const newKind = document.getElementById('eqKind').value || 'main';

  if (newKind === 'recurring' && before.kind !== 'recurring') {
    q.kind = 'recurring';
    q.intervalCount = q.intervalCount || 1;
    q.intervalUnit = q.intervalUnit || 'months';
    q.anchor = q.anchor || 'completion';
    q.nextDate = q.dueDate || todayStr();
    q.history = q.history || [];
    q.done = false; q.completedDate = null;
    save(); render(); closeModal();
    toast(`"${q.title}" converted to a recurring quest — set the interval next`, 'info');
    renderRecurringModal(q);
    return;
  }
  q.kind = newKind;

  const changed = [];
  if (before.title !== q.title) changed.push('title');
  if (before.note !== q.note) changed.push('note');
  if (before.xp !== q.xp) changed.push('XP');
  if (before.gems !== (q.gems||0)) changed.push('gems');
  if (before.priority !== q.priority) changed.push(`priority → ${priorityInfo(q.priority).label}`);
  if (before.kind !== q.kind) changed.push(`category → ${q.kind === 'side' ? 'Side' : 'Main'}`);
  if (before.target !== q.target) changed.push('XP recipient');
  if (before.createdDate !== q.createdDate) changed.push('created date');
  if (before.dueDate !== (q.dueDate||'')) changed.push('due date');

  save(); closeModal(); render();
  toast(changed.length ? `Saved "${q.title}": ${changed.join(', ')}` : `No changes to "${q.title}"`);
}

function saveRecurringEdits(id) {
  const q = appState.quests.find(x => x.id === id);
  if (!q) return;
  const before = { title: q.title, note: q.note||'', every: q.intervalCount, unit: q.intervalUnit, next: q.nextDate, anchor: q.anchor, xp: q.xp||0, gems: q.gems||0, target: q.target, kind: q.kind };
  q.title = document.getElementById('erTitle').value.trim() || q.title;
  q.note = document.getElementById('erNote').value.trim();
  q.intervalCount = Math.max(1, parseInt(document.getElementById('erEvery').value) || 1);
  q.intervalUnit = document.getElementById('erUnit').value || 'months';
  q.nextDate = document.getElementById('erNext').value || q.nextDate;
  q.anchor = document.getElementById('erAnchor').value || 'completion';
  q.xp = parseInt(document.getElementById('erXp').value) || 0;
  q.gems = parseInt(document.getElementById('erGems').value) || 0;
  q.target = document.getElementById('erTarget').value;
  const newKind = document.getElementById('erKind').value || 'recurring';

  if (newKind !== 'recurring') {
    q.kind = newKind;
    q.dueDate = q.nextDate;
    q.priority = parseInt(q.priority) || 2;
    save(); closeModal(); render();
    toast(`"${q.title}" is now a ${newKind === 'side' ? 'side' : 'main'} quest (no longer repeating)`, 'info');
    return;
  }

  const changed = [];
  if (before.title !== q.title) changed.push('title');
  if (before.note !== q.note) changed.push('note');
  if (before.every !== q.intervalCount || before.unit !== q.intervalUnit) changed.push(intervalText(q));
  if (before.next !== q.nextDate) changed.push(`next date → ${q.nextDate}`);
  if (before.anchor !== q.anchor) changed.push('anchor rule');
  if (before.xp !== q.xp) changed.push('XP');
  if (before.gems !== q.gems) changed.push('gems');
  if (before.target !== q.target) changed.push('XP recipient');

  save(); closeModal(); render();
  toast(changed.length ? `Saved "${q.title}": ${changed.join(', ')}` : `No changes to "${q.title}"`);
}
function drawQuestCal(q) {

function toggleQuestCompleteDate(id, ds) {
  const q = appState.quests.find(x => x.id === id);
  if (!q) return;
  if (q.done && q.completedDate === ds) {
    q.done = false; q.completedDate = null;
    toast(`"${q.title}" marked active again`, 'info');
  } else {
    if (!q.done) { grantXP(q.xp, q.target || 'even'); grantGems(q.gems); toast(`"${q.title}" completed on ${ds} — +${q.xp} XP`); }

  }

/* ===== TRAINING ===== */
function shiftDays(ds, delta) {
  const [y, m, d] = String(ds).split('-').map(Number);
  const dt = new Date(y, (m || 1) - 1, d || 1, 12, 0, 0);
  dt.setDate(dt.getDate() + delta);
  return fmtDate(dt);
}

/* A streak is alive if today OR yesterday is ticked — today isn't over yet,
   so an unticked today shouldn't erase the run behind it. */
function streakOf(h) {
  const log = h.log || {};
  const today = todayStr();
  const yesterday = shiftDays(today, -1);
  let cursor = log[today] ? today : (log[yesterday] ? yesterday : null);
  if (!cursor) return 0;
  let s = 0;
  while (log[cursor]) { s++; cursor = shiftDays(cursor, -1); }
  return s;
}

/* Longest run ever recorded, so past streaks aren't invisible. */
function bestStreakOf(h) {
  const days = Object.keys(h.log || {}).filter(k => h.log[k]).sort();
  let best = 0, run = 0, prev = null;
  days.forEach(d => {
    run = (prev && shiftDays(prev, 1) === d) ? run + 1 : 1;
    if (run > best) best = run;
    prev = d;
  });
  return best;
}

function streakBadgeHtml(h) {
  const cur = streakOf(h), best = bestStreakOf(h);
  const tickedToday = !!(h.log || {})[todayStr()];
  if (!cur) {
    return `<span class="text-slate-500"><i class="fa-regular fa-circle-dot"></i> no streak</span>`
      + (best ? ` <span class="text-slate-500">(best ${best})</span>` : '');
  }
  const fire = tickedToday
    ? `<i class="fa-solid fa-fire text-orange-400"></i>`
    : `<i class="fa-solid fa-fire text-orange-400/40" title="Streak still alive — tick today to keep it"></i>`;
  return `${fire} <span class="${tickedToday ? '' : 'text-amber-300'}">${cur} day streak${tickedToday ? '' : ' — due today'}</span>`
    + (best > cur ? ` <span class="text-slate-500">(best ${best})</span>` : '');
}

/* ===== SHARED CALENDAR ===== */
let sharedCalMonth = new Date();
function mountCalendar(context) { const wrap = document.getElementById('calWrap'); if (!wrap) return; drawSharedCal(wrap, context); }
function drawSharedCal(wrap, context) {
  const y = sharedCalMonth.getFullYear(), mo = sharedCalMonth.getMonth();
  const first = new Date(y, mo, 1).getDay();
  const days = new Date(y, mo+1, 0).getDate();
  const monthName = sharedCalMonth.toLocaleString('default',{month:'long',year:'numeric'});
  let cells = '';
  for (let i=0;i<first;i++) cells += '<div class="cal-cell"></div>';
  for (let d=1; d<=days; d++) {
    const ds = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const normal = appState.quests.filter(q => q.kind !== 'recurring');
    const dueQuests = normal.filter(q => q.dueDate && q.dueDate === ds);
    const createdOnly = normal.filter(q => !q.dueDate && q.createdDate === ds);
    const recurDue = appState.quests.filter(q => q.kind === 'recurring' && q.nextDate === ds);
    const trainingsDone = appState.trainings.filter(h => h.log[ds]);
    let badges = '';
    createdOnly.forEach(q => badges += `<div class="text-[10px] truncate bg-sky-600/80 rounded px-1 mb-0.5" title="Created: ${escapeAttr(q.title)}"><i class="fa-solid fa-plus"></i> ${escapeHtml(q.title)}</div>`);
    dueQuests.forEach(q => badges += `<div class="text-[10px] truncate bg-rose-600/80 rounded px-1 mb-0.5" title="Due: ${escapeAttr(q.title)}"><i class="fa-solid fa-flag"></i> ${escapeHtml(q.title)}</div>`);
    recurDue.forEach(q => badges += `<div class="text-[10px] truncate bg-purple-600/80 rounded px-1 mb-0.5" title="Recurring: ${escapeAttr(q.title)}"><i class="fa-solid fa-rotate"></i> ${escapeHtml(q.title)}</div>`);
    if (trainingsDone.length) badges += `<div class="text-[10px] text-emerald-400"><i class="fa-solid fa-fire"></i> ${trainingsDone.length} training${trainingsDone.length>1?'s':''}</div>`;
    const isToday = ds === todayStr();
    cells += `<div onclick="openDayDetail('${ds}')" class="cal-cell cursor-pointer rounded border ${isToday?'border-indigo-400':'border-slate-700'} bg-slate-800 hover:bg-slate-700 p-1 overflow-hidden">
      <div class="text-xs font-bold ${isToday?'text-indigo-300':'text-slate-400'}">${d}</div>${badges}</div>`;
  }
  wrap.innerHTML = `
    <div class="mt-6 mb-2 flex items-center justify-between">
      <h3 class="font-bold text-lg"><i class="fa-solid fa-calendar-days"></i> Calendar</h3>
      <div class="flex items-center gap-2">
        <button onclick="sharedCalMonth.setMonth(sharedCalMonth.getMonth()-1);drawSharedCal(document.getElementById('calWrap'),'${context}')" class="px-2 bg-slate-700 rounded">&lt;</button>
        <span class="font-bold text-sm">${monthName}</span>
        <button onclick="sharedCalMonth.setMonth(sharedCalMonth.getMonth()+1);drawSharedCal(document.getElementById('calWrap'),'${context}')" class="px-2 bg-slate-700 rounded">&gt;</button>
      </div>
    </div>
    <div class="flex gap-3 text-[11px] mb-1 text-slate-400 flex-wrap">
      <span><span class="inline-block w-3 h-3 bg-sky-600 rounded-sm"></span> Created</span>
      <span><span class="inline-block w-3 h-3 bg-rose-600 rounded-sm"></span> Due</span>
      <span><span class="inline-block w-3 h-3 bg-purple-600 rounded-sm"></span> Recurring</span>
      <span><i class="fa-solid fa-fire text-emerald-400"></i> Training done</span>
    </div>
    <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-1">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="grid grid-cols-7 gap-1">${cells}</div>`;
}
let dayDetailDate = null;

  openModal(`

    <p class="text-xs text-slate-400 mb-4">Tick to edit completion. Click a name to open its full editable details.</p>
    <h4 class="font-bold text-sky-300 mb-1">Quests</h4>
    <div class="mb-4 text-sm">${questRows}</div>
    ${recurToday.length ? `<h4 class="font-bold text-purple-300 mb-1">Recurring due</h4><div class="mb-4 text-sm">${recurRows}</div>` : ''}
    <div class="flex items-center justify-between mb-1">
      <h4 class="font-bold text-emerald-300">Training</h4>
      ${appState.trainings.length ? `<button onclick="setAllTrainings('${ds}', ${allChecked?'false':'true'})" class="text-xs ${allChecked?'bg-slate-600 hover:bg-slate-500':'bg-emerald-600 hover:bg-emerald-500'} px-2 py-1 rounded">

      </button>` : ''}
    </div>
    <div class="mb-4 text-sm">${trainingRows}</div>
    <div class="flex justify-end"><button onclick="closeModal();render()" class="bg-slate-600 px-3 py-1 rounded text-sm">Done</button></div>`);

function setQuestDone(id, checked, ds) {

function spreadsheet(entries, commitCall, editCall) {
  const rows = (entries || []).map(e => e.img ? `${e.value} | ${e.img}` : e.value);
  const total = Math.max(rows.length + 3, 6);
  let html = `<div class="flex items-center justify-between mb-1">
      <span class="text-[11px] text-slate-500">${rows.length} item${rows.length===1?'':'s'}</span>
      <button onclick="${editCall}" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded"><i class="fa-solid fa-pen-to-square"></i> Bulk edit / paste</button>
    </div>`;
  html += '<div class="ss-wrap">';
  for (let i = 0; i < total; i++) {
    const val = rows[i] || '';
    html += `<div class="ss-row"><div class="ss-num">${i+1}</div>
      <input class="ss-cell" value="${escapeAttr(val)}" onkeydown="ssKey(event)" onblur="ssCommit(this, ${JSON.stringify(commitCall).replace(/"/g,'&quot;')})"></div>`;
  }
  html += '</div>';
  return html;
}
function ssKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const cells = Array.from(e.target.closest('.ss-wrap').querySelectorAll('.ss-cell'));
    const idx = cells.indexOf(e.target);
    const next = cells[idx + 1];
    if (next) next.focus(); else e.target.blur();
  }
}
function ssCommit(inputEl, commitCall) {
  const cells = Array.from(inputEl.closest('.ss-wrap').querySelectorAll('.ss-cell'));
  const value = cells.map(c => c.value.trim()).filter(Boolean).join('\n');
  window.__ssTmp = value;
  eval(commitCall.replace('__VAL__', 'window.__ssTmp'));
}
function openBulkEdit(catId, subId, attrId, entryId) {

  else { const e = findEntry(sub, entryId).entry; entries = e.sub.entries; title = `${e.value} — ${e.sub.name}`; }
  const text = (entries || []).map(e => e.img ? `${e.value} | ${e.img}` : e.value).join('\n');
  openModal(`
    <h3 class="text-xl font-bold mb-2"><i class="fa-solid fa-pen-to-square"></i> Bulk Edit — ${escapeHtml(title)}</h3>

    <div class="flex gap-2 justify-end mt-4">

function saveBulkEdit(catId, subId, attrId, entryId) {

}
function attributeEditor(catId, subId, attr) {

  return `

    </div>`;
}
function nestedEditor(catId, subId, parentAttrId, entry) {
  const sub = entry.sub;
  const deeper = (sub.entries || []).filter(e => e.subEnabled).map(e => nestedEditor(catId, subId, parentAttrId, e)).join('');
  return `
    <div class="border border-slate-600 rounded p-2 bg-slate-900/40">
      <div class="flex items-center gap-2 mb-1 flex-wrap">
        <span class="text-xs text-slate-400">under</span>

        <button onclick="removeNested('${catId}','${subId}','${entry.id}')" class="text-red-400 text-xs ml-auto"><i class="fa-solid fa-xmark"></i></button>
      </div>

      ${deeper ? `<div class="mt-2 space-y-2 pl-3 border-l-2 border-emerald-500/30">${deeper}</div>` : ''}
    </div>`;
}
function findSub(catId, subId) { const cat = appState.categories.find(c => c.id === catId); const sub = cat && cat.subcategories.find(s => s.id === subId); return { cat, sub }; }
function parseSheet(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => { const [value, img] = line.split('|').map(p => p.trim()); return { value, img: img || '' }; });
}
function mergeEntries(oldEntries, parsed) {
  return parsed.map(p => { const existing = (oldEntries||[]).find(e => e.value === p.value); if (existing) { existing.img = p.img; return existing; } return { id: uid(), value: p.value, img: p.img, subEnabled: false, sub: null }; });
}
function findEntry(sub, entryId) {
  function walk(entries) { for (const e of (entries||[])) { if (e.id === entryId) return e; if (e.subEnabled && e.sub) { const r = walk(e.sub.entries); if (r) return r; } } return null; }
  for (const a of sub.attributes) { if (a.id === entryId) return { attr: a }; const r = walk(a.entries); if (r) return { entry: r }; }
  return {};
}
function addAttr(catId, subId) { const name = prompt('Attribute name (e.g. Type, Class, Name)?'); if (!name) return; const { sub } = findSub(catId, subId); sub.attributes.push({ id: uid(), name, count: 1, entries: [] }); save(); render(); toast(`Attribute "${name}" added`); }
function deleteAttr(catId, subId, attrId) { const { sub } = findSub(catId, subId); const a = sub.attributes.find(x => x.id === attrId); sub.attributes = sub.attributes.filter(x => x.id !== attrId); save(); render(); toast(`Deleted attribute "${a ? a.name : ''}"`, 'err'); }
function setAttrCount(catId, subId, attrId, val) { const { sub } = findSub(catId, subId); const a = sub.attributes.find(x => x.id === attrId); a.count = Math.max(1, parseInt(val) || 1); save(); toast(`"${a.name}" now rolls ${a.count} entr${a.count===1?'y':'ies'}`); }
function renameAttr(catId, subId, attrId, newName) { const { sub } = findSub(catId, subId); const a = sub.attributes.find(x => x.id === attrId); if (!a) return; const trimmed = (newName || '').trim(); if (!trimmed) { render(); return; } if (trimmed === a.name) return; const old = a.name; a.name = trimmed; save(); render(); toast(`Attribute renamed: "${old}" → "${trimmed}"`); }
function setAttrEntries(catId, subId, attrId, text) { const { sub } = findSub(catId, subId); const a = sub.attributes.find(x => x.id === attrId); a.entries = mergeEntries(a.entries, parseSheet(text)); save(); render(); }
function addNestedToEntry(catId, subId, parentAttrId, entryId, deeperParentEntryId) {

  if (deeperParentEntryId) { const parent = findEntry(sub, deeperParentEntryId).entry; target = parent && parent.sub && parent.sub.entries.find(e => e.id === entryId); }
  else { target = findEntry(sub, entryId).entry; }
  if (!target) return;
  const name = prompt('Name for this sub-attribute (e.g. Move, Variant)?', 'Sub');
  if (!name) return;
  target.subEnabled = true; target.sub = { name, count: 1, entries: [] };
  save(); render(); toast(`Sub-attribute "${name}" added under "${target.value}"`);
}
function setNestedName(catId, subId, entryId, val) { const { sub } = findSub(catId, subId); const e = findEntry(sub, entryId).entry; if (e && e.sub) { e.sub.name = val; toast(`Sub-attribute renamed to "${val}"`); } save(); }
function setNestedCount(catId, subId, entryId, val) { const { sub } = findSub(catId, subId); const e = findEntry(sub, entryId).entry; if (e && e.sub) { e.sub.count = Math.max(1, parseInt(val) || 1); toast(`"${e.sub.name}" now rolls ${e.sub.count}`); } save(); }
function setNestedEntries(catId, subId, entryId, text) { const { sub } = findSub(catId, subId); const e = findEntry(sub, entryId).entry; if (e && e.sub) e.sub.entries = mergeEntries(e.sub.entries, parseSheet(text)); save(); render(); }
function removeNested(catId, subId, entryId) { const { sub } = findSub(catId, subId); const e = findEntry(sub, entryId).entry; if (e) { e.subEnabled = false; e.sub = null; toast('Sub-attribute removed', 'err'); } save(); render(); }
function deleteSub(catId, subId) { if (!confirm('Delete subcategory?')) return; const { cat, sub } = findSub(catId, subId); const nm = sub ? sub.name : ''; cat.subcategories = cat.subcategories.filter(s => s.id !== subId); save(); render(); toast(`Deleted subcategory "${nm}"`, 'err'); }
function pickN(arr, n, noDup) {
  if (!arr.length) return [];
  if (noDup) {
    const pool = arr.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    return pool.slice(0, Math.min(n, pool.length));
  }
  const out = [];
  for (let i = 0; i < n; i++) out.push(arr[Math.floor(Math.random() * arr.length)]);
  return out;
}
function rollAttribute(attrName, attrLike, noDup) {
  const picks = [];
  const chosen = pickN(attrLike.entries || [], attrLike.count || 1, noDup);
  chosen.forEach(entry => {
    picks.push({ attr: attrName, value: entry.value, img: entry.img });
    if (entry.subEnabled && entry.sub) picks.push(...rollAttribute(`${attrName} — ${entry.sub.name}`, entry.sub, noDup));
  });
  return picks;
}
function generateRoll(catId, subId) {
  const { sub } = findSub(catId, subId);
  const noDup = !!sub.noDup;
  let picks = [];
  sub.attributes.forEach(a => { if ((a.entries||[]).length) picks = picks.concat(rollAttribute(a.name, a, noDup)); });
  sub.lastRoll = picks; save(); render();
}
function toggleNoDup(catId, subId) { const { sub } = findSub(catId, subId); sub.noDup = !sub.noDup; save(); render(); toast(`No duplicates ${sub.noDup ? 'ON' : 'OFF'} for "${sub.name}"`, 'info'); }
function saveRoll(catId, subId) {
  const { sub } = findSub(catId, subId);
  if (!sub.lastRoll) return;
  const label = prompt('Label for this saved result?', sub.lastRoll[0]?.value || 'Result');
  if (label === null) return;
  sub.savedResults = sub.savedResults || [];
  sub.savedResults.push({ id: uid(), label, picks: JSON.parse(JSON.stringify(sub.lastRoll)) });
  save(); render(); toast(`Result saved as "${label}"`);
}
function deleteSaved(catId, subId, rid) { const { sub } = findSub(catId, subId); const r = sub.savedResults.find(x => x.id === rid); sub.savedResults = sub.savedResults.filter(x => x.id !== rid); save(); render(); toast(`Deleted saved result "${r ? r.label : ''}"`, 'err'); }
function picksToMember(picks) {
  const attributes = {}; let name = 'Unnamed', img = '';
  picks.forEach(p => { if (name === 'Unnamed' && /name/i.test(p.attr)) name = p.value; if (p.img && !img) img = p.img; attributes[p.attr] = attributes[p.attr] ? attributes[p.attr] + ', ' + p.value : p.value; });
  if (name === 'Unnamed' && picks[0]) name = picks[0].value;
  return { id: uid(), name, level: 1, xp: 0, attributes, img };
}
function sendRollToParty(catId, subId) { const { sub } = findSub(catId, subId); if (!sub.lastRoll) return; const m = picksToMember(sub.lastRoll); appState.party.push(m); save(); toast(`"${m.name}" added to Party`); }
function savedToParty(catId, subId, rid) { const { sub } = findSub(catId, subId); const r = sub.savedResults.find(x => x.id === rid); const m = picksToMember(r.picks); appState.party.push(m); save(); toast(`"${m.name}" added to Party`); }
function addTrainingFromPicks(picks) {
  const nameAttr = picks.find(p => /name/i.test(p.attr)) || picks[0];
  const name = nameAttr ? nameAttr.value : 'New Training';
  const attributes = {};
  picks.forEach(p => attributes[p.attr] = attributes[p.attr] ? attributes[p.attr] + ', ' + p.value : p.value);
  appState.trainings.push({ id: uid(), name, note: '', xpEach: 20, gemsEach: 0, log: {}, target: appState.settings.trainingTarget, attributes });
  save(); toast(`"${name}" added to Training`);
}
function sendRollToTraining(catId, subId) { const { sub } = findSub(catId, subId); if (!sub.lastRoll) return; addTrainingFromPicks(sub.lastRoll); }
function savedToTraining(catId, subId, rid) { const { sub } = findSub(catId, subId); const r = sub.savedResults.find(x => x.id === rid); addTrainingFromPicks(r.picks); }

/* ===== MODAL HELPERS ===== */
function openModal(html) { document.getElementById('modalInner').innerHTML = html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
let modalDownTarget = null;
function modalDown(e) { modalDownTarget = e.target; }
function modalUp(e) { const backdrop = document.getElementById('modal'); if (modalDownTarget === backdrop && e.target === backdrop) closeModal(); modalDownTarget = null; }

/* ===== IMPORT / EXPORT ===== */
function exportData() {
  const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `rpg-superapp-backup-${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
  toast('Backup exported');
}
/* ---- Import with Replace / Merge choice ---- */
let pendingImport = null;
let pendingMerge = null;

function normalizeImport(d) {
  const out = Object.assign(defaultState(), d);
  ['categories','checklists','party','quests','trainings','shop'].forEach(k => {
    if (!Array.isArray(out[k])) out[k] = [];
  });
  out.gems = Number(out.gems) || 0;
  out.settings = Object.assign({ questTarget:'even', trainingTarget:'even' }, out.settings || {});
  return out;
}

const lc = s => String(s || '').trim().toLowerCase();
const keyOf = {
  party:      m  => lc(m.name),
  quests:     q  => (q.kind || 'main') + '|' + lc(q.title),
  trainings:  h  => lc(h.name),
  shop:       s  => lc(s.name),
  categories: c  => lc(c.name),
  checklists: c  => lc(c.name),
  named:      x  => lc(x.name)
};

/* Match on id first (same item that travelled between devices),
   then on name/title (same thing created independently on two devices). */
function findMatch(arr, item, keyFn) {
  const byId = arr.find(x => x.id === item.id);
  if (byId) return byId;
  const k = keyFn(item);
  if (!k) return null;
  return arr.find(x => keyFn(x) === k) || null;
}

/* Builds a merged copy without touching appState, plus a report of what changed.
   Rule: local always wins on conflicts; only genuinely absent things get added. */
function computeMerge(inc) {
  const t = JSON.parse(JSON.stringify(appState));
  const r = { party:0, quests:0, trainings:0, shop:0, categories:0, subcats:0,
              attrs:0, entries:0, saved:0, checklists:0, chkItems:0, logDays:0,
              gemsBefore: t.gems || 0, gemsAfter: 0 };
  const clone = o => JSON.parse(JSON.stringify(o));

  [['party', keyOf.party], ['quests', keyOf.quests], ['shop', keyOf.shop]].forEach(([k, kf]) => {
    (inc[k] || []).forEach(item => {
      if (!findMatch(t[k], item, kf)) { t[k].push(clone(item)); r[k]++; }
    });
  });

  (inc.trainings || []).forEach(h => {
    const mine = findMatch(t.trainings, h, keyOf.trainings);
    if (!mine) { t.trainings.push(clone(h)); r.trainings++; return; }
    mine.log = mine.log || {};
    Object.keys(h.log || {}).forEach(d => {
      if (h.log[d] && !mine.log[d]) { mine.log[d] = true; r.logDays++; }
    });
  });

  (inc.checklists || []).forEach(cl => {
    const mine = findMatch(t.checklists, cl, keyOf.checklists);
    if (!mine) { t.checklists.push(clone(cl)); r.checklists++; return; }
    mine.items = mine.items || [];
    (cl.items || []).forEach(it => {
      const has = mine.items.some(x => x.id === it.id || lc(x.text) === lc(it.text));
      if (!has) { mine.items.push({ id: uid(), text: it.text, done: false }); r.chkItems++; }
    });
    mine.completions = Math.max(mine.completions || 0, cl.completions || 0);
  });

  (inc.categories || []).forEach(cat => {
    const mine = findMatch(t.categories, cat, keyOf.categories);
    if (!mine) { t.categories.push(clone(cat)); r.categories++; return; }
    mine.subcategories = mine.subcategories || [];
    (cat.subcategories || []).forEach(sub => {
      const msub = findMatch(mine.subcategories, sub, keyOf.named);
      if (!msub) { mine.subcategories.push(clone(sub)); r.subcats++; return; }
      msub.attributes = msub.attributes || [];
      (sub.attributes || []).forEach(a => {
        const ma = findMatch(msub.attributes, a, keyOf.named);
        if (!ma) { msub.attributes.push(clone(a)); r.attrs++; return; }
        ma.entries = ma.entries || [];
        (a.entries || []).forEach(en => {
          if (!ma.entries.some(x => lc(x.value) === lc(en.value))) { ma.entries.push(clone(en)); r.entries++; }
        });
      });
      msub.savedResults = msub.savedResults || [];
      (sub.savedResults || []).forEach(sr => {
        if (!msub.savedResults.some(x => x.id === sr.id || x.label === sr.label)) {
          msub.savedResults.push(clone(sr)); r.saved++;
        }
      });
    });
  });

  t.gems = Math.max(t.gems || 0, inc.gems || 0);
  r.gemsAfter = t.gems;
  t.settings = clone(appState.settings);
  t.activeTab = appState.activeTab;
  return { state: t, report: r };
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let data;
    try { data = migrate(JSON.parse(ev.target.result)); }
    catch (err) { toast('Invalid JSON file', 'err'); e.target.value = ''; return; }
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      toast('That file does not look like a backup', 'err'); e.target.value = ''; return;
    }
    pendingImport = normalizeImport(data);
    pendingMerge = computeMerge(pendingImport);
    const nm = file.name;
    e.target.value = '';
    openImportChoice(nm);
  };
  reader.readAsText(file);
}

function openImportChoice(fileName) {
  const inc = pendingImport, r = pendingMerge.report;
  const row = (label, mine, theirs, add) => `
    <div class="grid grid-cols-4 gap-2 border-b border-slate-700 py-1">
      <span class="text-slate-400">${label}</span>
      <span class="text-center">${mine}</span>
      <span class="text-center">${theirs}</span>
      <span class="text-center ${add ? 'text-emerald-400 font-bold' : 'text-slate-600'}">${add ? '+' + add : '—'}</span>
    </div>`;
  const extras = [
    r.logDays  ? `${r.logDays} training log day${r.logDays===1?'':'s'}` : '',
    r.chkItems ? `${r.chkItems} checklist item${r.chkItems===1?'':'s'}` : '',
    r.entries  ? `${r.entries} generator entr${r.entries===1?'y':'ies'}` : '',
    r.subcats  ? `${r.subcats} subcategor${r.subcats===1?'y':'ies'}` : '',
    r.attrs    ? `${r.attrs} attribute${r.attrs===1?'':'s'}` : '',
    r.saved    ? `${r.saved} saved result${r.saved===1?'':'s'}` : ''
  ].filter(Boolean);
  openModal(`
    <h3 class="text-xl font-bold mb-1"><i class="fa-solid fa-upload"></i> Import ${escapeHtml(fileName)}</h3>
    <p class="text-xs text-slate-400 mb-4">Choose how to apply this file. There is no undo, so keep the backup box ticked unless you are sure.</p>
    <div class="text-sm mb-4">
      <div class="grid grid-cols-4 gap-2 text-xs text-slate-500 font-bold border-b border-slate-600 pb-1">
        <span></span><span class="text-center">On this device</span><span class="text-center">In file</span><span class="text-center">Merge adds</span>
      </div>
      ${row('Party',      appState.party.length,      inc.party.length,      r.party)}
      ${row('Quests',     appState.quests.length,     inc.quests.length,     r.quests)}
      ${row('Trainings',  appState.trainings.length,  inc.trainings.length,  r.trainings)}
      ${row('Shop items', appState.shop.length,       inc.shop.length,       r.shop)}
      ${row('Checklists', appState.checklists.length, inc.checklists.length, r.checklists)}
      ${row('Categories', appState.categories.length, inc.categories.length, r.categories)}
      ${row('Gems',       appState.gems || 0,         inc.gems || 0,         0)}
    </div>
    ${extras.length ? `<p class="text-xs text-emerald-300 mb-3">Merge would also add: ${extras.join(', ')}.</p>` : ''}
    <label class="flex items-center gap-2 text-xs text-slate-300 mb-4">
      <input type="checkbox" id="impBackup" checked> Download a backup of my current data first
    </label>
    <div class="space-y-2">
      <button onclick="applyImport('merge')" class="w-full bg-emerald-600 hover:bg-emerald-500 rounded p-3 text-left">
        <div class="font-bold"><i class="fa-solid fa-object-group"></i> Merge — add only what's missing</div>
        <div class="text-xs text-emerald-100 mt-1">Keeps everything already here. Anything in the file that this device doesn't have gets added. On a conflict, your local version wins. Training calendars are combined, so ticks from both devices survive.</div>
      </button>
      <button onclick="applyImport('replace')" class="w-full bg-rose-600 hover:bg-rose-500 rounded p-3 text-left">
        <div class="font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Replace — wipe and use the file</div>
        <div class="text-xs text-rose-100 mt-1">Discards everything currently on this device, including anything not in the file. This is the old behaviour.</div>
      </button>
      <button onclick="pendingImport=null;pendingMerge=null;closeModal()" class="w-full bg-slate-600 hover:bg-slate-500 rounded p-2 text-sm">Cancel</button>
    </div>`);
}

function applyImport(mode) {
  if (!pendingImport) return;
  const cb = document.getElementById('impBackup');
  if (cb && cb.checked) exportData();

  if (mode === 'replace') {
    const inc = pendingImport;
    appState = inc;
    if (appState.activeTab &&
        ((appState.activeTab.startsWith('cat_') && !appState.categories.find(c => 'cat_' + c.id === appState.activeTab)) ||
         (appState.activeTab.startsWith('chk_') && !appState.checklists.find(c => 'chk_' + c.id === appState.activeTab)))) {
      appState.activeTab = 'party';
    }
    save(); closeModal(); render();
    toast(`Replaced — ${appState.quests.length} quests, ${appState.trainings.length} trainings, ${appState.party.length} members`, 'info');
  } else {
    const { state, report } = pendingMerge;
    appState = state;
    save(); closeModal(); render();
    const bits = [
      report.party      ? `${report.party} member${report.party===1?'':'s'}` : '',
      report.quests     ? `${report.quests} quest${report.quests===1?'':'s'}` : '',
      report.trainings  ? `${report.trainings} training${report.trainings===1?'':'s'}` : '',
      report.shop       ? `${report.shop} shop item${report.shop===1?'':'s'}` : '',
      report.checklists ? `${report.checklists} checklist${report.checklists===1?'':'s'}` : '',
      report.categories ? `${report.categories} categor${report.categories===1?'y':'ies'}` : '',
      report.chkItems   ? `${report.chkItems} checklist item${report.chkItems===1?'':'s'}` : '',
      report.logDays    ? `${report.logDays} log day${report.logDays===1?'':'s'}` : '',
      report.entries    ? `${report.entries} entr${report.entries===1?'y':'ies'}` : ''
    ].filter(Boolean);
    toast(bits.length ? `Merged — added ${bits.join(', ')}` : 'Merged — nothing new to add');
  }
  pendingImport = null; pendingMerge = null;
}
/* ===== BOOT ===== */
render();
</script>
